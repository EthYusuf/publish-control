<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14"/>
      <stop offset="50%" stop-color="#0b1120"/>
      <stop offset="100%" stop-color="#050811"/>
    </linearGradient>

    <!-- Shield Glow & Gradients -->
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.8"/>
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Subtle Cyber Grid -->
  <g opacity="0.06" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="1200" y2="90"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="270" x2="1200" y2="270"/>
    <line x1="0" y1="360" x2="1200" y2="360"/>
    <line x1="0" y1="450" x2="1200" y2="450"/>
    <line x1="0" y1="540" x2="1200" y2="540"/>
    <line x1="120" y1="0" x2="120" y2="630"/>
    <line x1="240" y1="0" x2="240" y2="630"/>
    <line x1="360" y1="0" x2="360" y2="630"/>
    <line x1="480" y1="0" x2="480" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="720" y1="0" x2="720" y2="630"/>
    <line x1="840" y1="0" x2="840" y2="630"/>
    <line x1="960" y1="0" x2="960" y2="630"/>
    <line x1="1080" y1="0" x2="1080" y2="630"/>
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="180" r="160" fill="#06b6d4" opacity="0.12" filter="url(#glow)"/>
  <circle cx="1000" cy="450" r="200" fill="#6366f1" opacity="0.1" filter="url(#glow)"/>
  <circle cx="600" cy="300" r="120" fill="#10b981" opacity="0.15" filter="url(#glow)"/>

  <!-- Top Badge: Model Context Protocol -->
  <g transform="translate(100, 75)">
    <rect width="240" height="36" rx="18" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <circle cx="22" cy="18" r="6" fill="#10b981"/>
    <text x="38" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" letter-spacing="1">MODEL CONTEXT PROTOCOL</text>
  </g>

  <!-- Version Pill -->
  <g transform="translate(355, 75)">
    <rect width="90" height="36" rx="18" fill="#0284c7" fill-opacity="0.2" stroke="#0284c7" stroke-width="1"/>
    <text x="22" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8">v1.0.0</text>
  </g>

  <!-- Main Headline -->
  <text x="100" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#ffffff" letter-spacing="-1">
    PUBLISH CONTROL
  </text>

  <!-- Glowing Accent Bar -->
  <rect x="100" y="220" width="340" height="4" rx="2" fill="url(#accentGlow)" filter="url(#subtleGlow)"/>

  <!-- Subtitle -->
  <text x="100" y="270" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="500" fill="#94a3b8">
    Pre-Publish Security Gate for AI-Generated Code
  </text>

  <!-- Description paragraph -->
  <text x="100" y="325" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#64748b" width="600">
    Antigravity • Cursor • Claude Desktop • Codex
  </text>
  <text x="100" y="355" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" fill="#cbd5e1">
    17 Otomatik Güvenlik &amp; Kalite Denetim Modülü • Tek Komutla Analiz
  </text>

  <!-- 17 Checks Chips Grid (Left) -->
  <g transform="translate(100, 400)">
    <!-- Row 1 -->
    <rect x="0" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="21" font-family="sans-serif" font-size="12" fill="#38bdf8">🔑 Secrets Scan</text>

    <rect x="140" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="21" transform="translate(140, 0)" font-family="sans-serif" font-size="12" fill="#34d399">📁 Env Security</text>

    <rect x="280" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="21" transform="translate(280, 0)" font-family="sans-serif" font-size="12" fill="#f87171">💉 Injection</text>

    <rect x="420" y="0" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="21" transform="translate(420, 0)" font-family="sans-serif" font-size="12" fill="#fbbf24">🔒 Auth &amp; JWT</text>

    <!-- Row 2 -->
    <rect x="0" y="44" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="21" transform="translate(0, 44)" font-family="sans-serif" font-size="12" fill="#a78bfa">🛡️ CORS Audit</text>

    <rect x="140" y="44" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="21" transform="translate(140, 44)" font-family="sans-serif" font-size="12" fill="#38bdf8">🌍 SSRF / Cloud</text>

    <rect x="280" y="44" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="21" transform="translate(280, 44)" font-family="sans-serif" font-size="12" fill="#34d399">🐳 Docker Hardening</text>

    <rect x="420" y="44" width="130" height="32" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
    <text x="12" y="21" transform="translate(420, 44)" font-family="sans-serif" font-size="12" fill="#f472b6">+10 Modül Daha</text>
  </g>

  <!-- Right Graphic: Futuristic Security Shield & Radar -->
  <g transform="translate(870, 310)">
    <!-- Outer concentric radar rings -->
    <circle cx="0" cy="0" r="190" fill="none" stroke="#1e293b" stroke-dasharray="6,8" stroke-width="1"/>
    <circle cx="0" cy="0" r="145" fill="none" stroke="#334155" stroke-width="1"/>
    <circle cx="0" cy="0" r="105" fill="#0f172a" stroke="#0ea5e9" stroke-opacity="0.3" stroke-width="2"/>

    <!-- Shield Glow Backing -->
    <path d="M0 -75 L60 -35 L60 30 C60 70 0 100 0 100 C0 100 -60 70 -60 30 L-60 -35 Z"
          fill="url(#shieldGrad)" opacity="0.2" filter="url(#glow)"/>

    <!-- Shield Outline -->
    <path d="M0 -75 L60 -35 L60 30 C60 70 0 100 0 100 C0 100 -60 70 -60 30 L-60 -35 Z"
          fill="#0f172a" stroke="url(#shieldGrad)" stroke-width="4"/>

    <!-- Digital Lock Checkmark Icon inside Shield -->
    <path d="M-18 8 L-6 20 L22 -10" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Orbiting Scanning Nodes -->
    <circle cx="102" cy="-55" r="7" fill="#10b981" filter="url(#subtleGlow)"/>
    <circle cx="-120" cy="35" r="6" fill="#38bdf8" filter="url(#subtleGlow)"/>
    <circle cx="45" cy="130" r="5" fill="#6366f1" filter="url(#subtleGlow)"/>
    <circle cx="-75" cy="-115" r="6" fill="#f43f5e" filter="url(#subtleGlow)"/>
  </g>

  <!-- Terminal Status Pill at bottom right -->
  <g transform="translate(680, 520)">
    <rect width="420" height="48" rx="12" fill="#0f172a" stroke="#1e293b" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="5" fill="#10b981"/>
    <text x="40" y="29" font-family="'Courier New', monospace" font-size="14" font-weight="600" fill="#e2e8f0">
      $ /publish-control -> Score: 100/100 PASSED
    </text>
  </g>

  <!-- Author Tag at bottom left -->
  <text x="100" y="550" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="600" fill="#475569">
    Developed by <tspan fill="#38bdf8">EthYusuf</tspan> • Open Source on GitHub
  </text>
</svg>
